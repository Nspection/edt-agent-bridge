name: Publish verified Pages snapshot

on:
  workflow_dispatch:
    inputs:
      pages_commit:
        description: Exact gh-pages commit to publish
        required: true
        type: string
      release_commit:
        description: Expected source_commit from release-manifest.json
        required: true
        type: string
      version:
        description: Expected Bridge version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out published tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: pages-snapshot
          persist-credentials: false
      - name: Verify exact snapshot and release hashes
        env:
          EXPECT_PAGES_COMMIT: ${{ inputs.pages_commit }}
          EXPECT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          EXPECT_VERSION: ${{ inputs.version }}
        run: python3 tools/verify-pages-snapshot.py pages-snapshot pages-verified
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload verified snapshot
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-verified
      - name: Deploy snapshot
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
